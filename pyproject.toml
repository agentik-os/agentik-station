[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentik-station"
version = "11.12"
description = "Safe, evidence-driven Linux control plane and Zone reconciler for Agentik Station."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AGK / Agentik" }]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "Pillow==12.3.0",
]

[project.scripts]
station = "agentik_station.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "factory/tests"]
addopts = "-ra"

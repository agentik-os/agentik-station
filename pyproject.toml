[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentik-station"
version = "11.12"
description = "Safe, evidence-driven Linux control plane and Zone reconciler for Agentik Station."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AGK / Agentik" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "PyYAML>=6",
  "jsonschema>=4",
]

[project.scripts]
station = "agentik_station.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "factory/tests"]
addopts = "-ra"

services:
  hermes:
    image: nousresearch/hermes-agent:<PINNED_VERSION_OR_DIGEST>
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: 1gb

    volumes:
      - /var/lib/station/zones/<zone-id>/hermes:/opt/data
      - /srv/station/2_ZONES/<category>/<zone>/<environment>/projects:/workspace/projects

    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

    environment:
      HERMES_DASHBOARD: "1"

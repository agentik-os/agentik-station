trust_zones:
  station-system:
    linux_user: station-system
    hermes_home: /home/station-system/.hermes
    allowed_roots: [/etc/station, /opt/station, /var/lib/station, /var/log/station]
  private-self:
    linux_user: gareth-private
    hermes_home: /home/gareth-private/.hermes
    allowed_roots: [/srv/station/zones/private-self]
  personal-projects:
    linux_user: gareth-projects
    hermes_home: /home/gareth-projects/.hermes
    allowed_roots: [/srv/station/zones/personal-projects]
  agentik-dev:
    linux_user: agentik-dev
    hermes_home: /home/agentik-dev/.hermes
    allowed_roots: [/srv/station/zones/agentik-dev]
  os-factory:
    linux_user: os-factory
    hermes_home: /home/os-factory/.hermes
    allowed_roots: [/srv/station/zones/os-factory]
  lab:
    linux_user: station-lab
    hermes_home: /home/station-lab/.hermes
    allowed_roots: [/srv/station/zones/lab]
    production_secrets: false

organization:
  id: gareth
  name: Gareth
  type: owner_station

trust_zones:
  - id: private-self
    linux_user: gareth-private
    hermes_home: /home/gareth-private/.hermes
    macro_domains:
      - id: self-development
        os: [identity, mindset, journal, decision, routine, relationship, connector, learning]

  - id: personal-projects
    linux_user: gareth-projects
    hermes_home: /home/gareth-projects/.hermes
    projects_from: /etc/station/projects.d

  - id: agentik-dev
    linux_user: agentik-dev
    hermes_home: /home/agentik-dev/.hermes
    projects: [agentik, agk, station]

  - id: os-factory
    linux_user: os-factory
    hermes_home: /home/os-factory/.hermes
    os: [librarian-os, builder-os, devops-os]

  - id: lab
    linux_user: station-lab
    hermes_home: /home/station-lab/.hermes
    production_secrets: false

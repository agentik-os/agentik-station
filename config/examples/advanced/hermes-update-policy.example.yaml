hermes_updates:
  check_interval: 6h
  upstream_branch: main
  rings:
    lab:
      auto_check: true
      auto_apply_candidate_update: true
      require_full_backup: true
      production_credentials: false
    gareth_candidate:
      auto_promote_when_all_gates_pass: true
      minimum_burn_in: 6h
      breaking_change_requires_human: true
    stable:
      auto_apply: false
      require_signed_station_release: true
    client_stable:
      auto_apply: false
      require_client_policy_and_maintenance_window: true
  gates:
    - hermes_doctor
    - hooks_doctor
    - station_doctor
    - core_os_contracts
    - builder_librarian_tests
    - engineering_regression
    - discord_readback
    - fresh_session_acceptance
    - recovery_rehearsal

# Agentik Station optional dependency stack (11.12+)
# Maturity: SCAFFOLDED or INSTALLABLE until Host Doctor/readback proves more.
schema_version: 1
hermes:
  track: main
  release_pin: v2026.8.31
  commit_pin: 29112bef099274229cadff79cdff7bf7b99c4b77
  python: "3.11"
  install_url: https://hermes-agent.nousresearch.com/install.sh
  installer_sha256: 5854b15670b51a8daae8f59ddfa917062de9f74be261eb73b4b8d719710f8968
  update_command: hermes update
  check_command: hermes update --check
  auto_update:
    unit: station-hermes-update.timer
    schedule: weekly
    note: Enabled by bootstrap unless --skip-hermes-auto-update; updates run as agk-station, with backup, Doctor and receipt.
toolchain:
  policy: User-local pinned tools; authentication remains operator-owned.
  python:
    latest_stable: 3.14.7
    note: Separate from Hermes because Hermes currently supports Python >=3.11,<3.14.
    ai_compatibility: 3.13.15
    ai_note: Isolated AI SDK/tools use the latest reviewed 3.13 maintenance release for wheel compatibility.
  node:
    lts: 24.20.0
  commands:
    github_cli: 2.100.0
    vercel_cli: 59.11.2
    codex_cli: 0.153.2
    composio_cli: 0.4.0
    shadcn_cli: 4.21.0
    note: Remote installer scripts are checksum-locked; package/archive integrity is verified before install.
resources:
  catalog: resources/CATALOG.json
  default_stack: web-product
  policy: Stack recipes are defaults, not a vendor lock; exact Project choices remain contract-driven.
components:
  - id: ponytail
    repository: https://github.com/DietrichGebert/ponytail
    role: Agent skill / YAGNI coding posture for Hermes + Claude Code
    version: v4.9.0
    commit_pin: 0a4dd63ad4541f4f655c4108a295916f3c1d8fda
    install: hermes-plugin
    maturity: INSTALLABLE
  - id: langfuse
    repository: https://github.com/langfuse/langfuse
    role: LLM observability / evals (self-hosted or cloud)
    version: v4.28.1
    install: pinned-source-checkout
    maturity: INSTALLABLE
  - id: honcho
    repository: https://github.com/plastic-labs/honcho
    role: Stateful agent memory library
    version: 2.4.0
    install: isolated-python-sdk
    maturity: INSTALLABLE
  - id: hindsight
    repository: https://github.com/vectorize-io/hindsight
    role: Agent memory that learns
    version: 0.9.2
    install: hermes-native-memory-or-isolated-client
    maturity: INSTALLABLE
  - id: tigervnc
    repository: https://github.com/TigerVNC/tigervnc
    role: High-performance VNC for remote desktop sessions
    install: apt
    packages: [tigervnc-standalone-server, tigervnc-viewer]
    upstream_release: v1.16.2
    maturity: INSTALLABLE
  - id: crawl4ai
    repository: https://github.com/unclecode/crawl4ai
    role: LLM-friendly web crawler / scraper tool for agents
    version: 0.9.3
    install: isolated-python-tool
    maturity: INSTALLABLE
platforms:
  note: Hermes Messaging Gateway is the single process for multi-platform bots.
  setup: hermes gateway setup
  start: hermes gateway start
  docs: https://hermes-agent.nousresearch.com/docs/user-guide/messaging
  surfaces:
    - Telegram
    - Discord
    - Slack
    - WhatsApp
    - Signal
    - SMS
    - Email
    - Home Assistant
    - Mattermost
    - Matrix
    - DingTalk
    - Feishu/Lark
    - WeCom
    - Weixin
    - BlueBubbles/iMessage
    - QQ
    - Yuanbao
    - Microsoft Teams
    - LINE
    - ntfy
    - browser

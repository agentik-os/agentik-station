workflows:
  - id: default-mission
    graph: clarify -> architect -> plan -> forge -> sentinel -> release -> sre-readback -> atlas-accept
    gates:
      - scope-resolved
      - plan-persisted
      - implementation-tested
      - independent-review-passed
      - ci-and-release-evidence
      - external-readback-when-applicable
      - recovery-coordinate-recorded
    parallel_branches:
      allowed: true
      condition: explicit-owner-and-non-overlapping-state
    production:
      approval: human-policy-authority
      default: denied
    tracker:
      protocol: agk-work-tracker/v1
      default_adapter: linear
      stable_state_ids: required
    correction_context: same-work-record-branch-pr-hermes-session
    blocked: only-when-no-useful-next-action-remains
    material_comment_dedupe: work-record+event+artifact-version
  - id: incident-mitigation
    graph: observe -> declare-incident-record -> contain -> recover -> readback -> postmortem
    emergency_record: create-automatically-before-first-mutation
    production:
      approval: incident-policy-authority
      destructive_default: denied

name: release-provenance

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify exact source metadata
        run: |
          python scripts/generate_release_metadata.py --check
          ./station doctor --repo
      - name: Build immutable source archive
        run: |
          git archive --format=tar.gz --prefix=agentik-station/ --output=agentik-station-${{ github.sha }}.tar.gz HEAD
          sha256sum agentik-station-${{ github.sha }}.tar.gz > agentik-station-${{ github.sha }}.tar.gz.sha256
      - name: GitHub artifact attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: agentik-station-${{ github.sha }}.tar.gz
      - name: Upload archive, checksum, SBOM and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentik-station-${{ github.sha }}
          path: |
            agentik-station-${{ github.sha }}.tar.gz
            agentik-station-${{ github.sha }}.tar.gz.sha256
            SBOM.cdx.json
            RELEASE_PROVENANCE.json
          if-no-files-found: error
          retention-days: 30

name: station-ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  portable-native-linux:
    name: Native Linux Workstation (no accounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare explicit ephemeral-runner prerequisites
        run: |
          python -m pip install uv==0.12.9 playwright==1.62.0
          python -m playwright install-deps chromium
      - name: Install packed Workstation and exercise native TUI and synthetic sessions
        run: node installer/npm/test/native-install.mjs

  portable-package:
    name: npm Workstation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Portable CLI, scope, service, process and terminal regressions
        run: npm test
      - name: Pack and install the exact consumer tarball without hooks
        run: node installer/npm/test/pack-smoke.mjs

  web-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: crawl4ai
            version: 0.9.3
          - component: scrapegraphai
            version: 2.2.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install isolated library and browser dependencies
        env:
          WEB_COMPONENT: ${{ matrix.component }}
          WEB_VERSION: ${{ matrix.version }}
        run: |
          python -m pip install "$WEB_COMPONENT==$WEB_VERSION" playwright==1.62.0 pytest==8.4.2
          python -m playwright install --with-deps chromium
          if [ "$WEB_COMPONENT" = scrapegraphai ]; then
            python -c 'import tiktoken; tiktoken.get_encoding("o200k_base"); tiktoken.get_encoding("cl100k_base")'
          fi
      - name: Verify actual imports and Chromium launch without provider credentials
        env:
          WEB_COMPONENT: ${{ matrix.component }}
        run: |
          printf '{"component":"%s","health":true}\n' "$WEB_COMPONENT" | python components/agk-tui/hermes/plugins/agentik_os/scrapegraph_runner.py
      - name: Adversarial adapters and actual offline library execution
        run: pytest -q -p no:cacheprovider components/agk-tui/tests/test_web_extraction.py

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Remove editable-install metadata from the checkout
        run: |
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +
          find . -type d -name '.eggs' -prune -exec rm -rf {} +

      - name: Repository Doctor
        run: ./station doctor --repo

      - name: Unit, security, contract and temp-root install tests
        run: pytest -q -p no:cacheprovider

      - name: AGK-TUI shipped component tests
        run: pytest -q -p no:cacheprovider components/agk-tui/tests

      - name: Builder and Librarian deterministic gates
        run: python factory/tests/run_tests.py

      - name: Shell syntax and controller identity hygiene
        run: |
          git ls-files '*.sh' bootstrap.sh station.sh | xargs -r -n1 bash -n
          python - <<'PY'
          import re
          from pathlib import Path
          controller = Path('components/agk-tui/scripts/client_control.py').read_text()
          matches = re.findall(r'(?<![0-9])[0-9]{17,20}(?![0-9])', controller)
          assert not matches, f'hard-coded Discord-like IDs in controller: {matches}'
          workflow = '\n'.join(path.read_text() for path in Path('.github/workflows').glob('*.yml'))
          assert not re.search(r'uses:\s+[^\s]+@(v|main|master)(?:\s|$)', workflow)
          print('SHELL_AND_IDENTITY_HYGIENE_OK')
          PY

      - name: Deterministic SBOM and release provenance
        run: python scripts/generate_release_metadata.py --check

      - name: Validate Python syntax without generating bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ignored = {"history"}
          files = []
          for path in Path('.').rglob('*.py'):
              if any(part in ignored for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              files.append(path)
          print(f'PYTHON_AST_OK {len(files)} files')
          PY

      - name: Validate JSON, YAML and selected schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          import jsonschema

          ignored_parts = {"history"}
          json_files = []
          yaml_files = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
                  json_files.append(path)
              elif path.suffix in {'.yaml', '.yml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  yaml_files.append(path)

          install_schema = json.loads(Path('contracts/install-spec.schema.json').read_text())
          install_example = {
              "schema_version": 1,
              "release_version": Path('VERSION').read_text().strip(),
              "operation_id": "op-ci-example",
              "host_id": "organization-alpha-prod-01",
              "role": "team",
              "install_system_packages": False,
              "configure_fail2ban": False,
              "enable_doctor_timer": False,
              "seed": {
                  "category": "ORGANIZATIONS",
                  "name": "organization-alpha",
                  "environment": "production",
                  "organization": "organization-alpha",
                  "project": "platform"
              }
          }
          jsonschema.validate(install_example, install_schema)
          release_schema = json.loads(Path('contracts/release-manifest.schema.json').read_text())
          release_manifest = json.loads(Path('MANIFEST.json').read_text())
          jsonschema.validate(release_manifest, release_schema)
          actual_files = sorted(
              str(path) for path in Path('.').rglob('*')
              if path.is_file()
              and '.git' not in path.parts
              and not any(part.endswith('.egg-info') for part in path.parts)
          )
          assert release_manifest['files'] == actual_files
          assert release_manifest['file_count'] == len(actual_files)
          print(f'JSON_OK {len(json_files)} YAML_OK {len(yaml_files)} SCHEMA_OK')
          PY

      - name: Compile exact full/core and team plans
        run: |
          ./station plan --host-id station-core-01 --role core --json > /tmp/core-plan.json
          ./station plan \
            --host-id organization-alpha-prod-01 \
            --role team \
            --seed-category ORGANIZATIONS \
            --seed-name organization-alpha \
            --seed-env production \
            --seed-organization organization-alpha \
            --seed-project platform \
            --json > /tmp/team-plan.json
          python - <<'PY'
          import json
          for path in ['/tmp/core-plan.json', '/tmp/team-plan.json']:
              payload = json.load(open(path))
              assert payload['final_claim_if_successful'] == 'READY_FOR_SETUP'
          print('PLAN_CONTRACT_OK')
          PY

      - name: Final repository hygiene
        run: |
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) -print -quit | (! grep .)
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | (! grep .)
          ./station doctor --repo

  python-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q -p no:cacheprovider tests/unit tests/security

  node-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            components/agk-tui/apps/hermes-fleet/package-lock.json
            resources/discord-js-sdk/package-lock.json
      - name: Hermes Fleet tests and production build
        working-directory: components/agk-tui/apps/hermes-fleet
        run: npm ci --ignore-scripts && npm test && npm run build
      - name: Isolated discord.js lock and version
        working-directory: resources/discord-js-sdk
        run: |
          npm ci --ignore-scripts --omit=dev
          node -e "if (require('discord.js').version !== '14.27.0') process.exit(1)"

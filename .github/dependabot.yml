version: 2
# Reviewed updates are integrated manually on main; see
# docs/operations/DEPENDENCY_UPDATE_POLICY.md. Security alerts remain separate.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /components/agk-tui/apps/hermes-fleet
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /resources/discord-js-sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

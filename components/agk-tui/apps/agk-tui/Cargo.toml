[package]
name = "agk-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AGK Mission Control for persistent Hermes and RMUX work"

[[bin]]
name = "agk-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
ratatui-rmux = "0.10.0"
rmux-sdk = "0.10.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sysinfo = "0.39"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.20"

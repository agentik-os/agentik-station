commands:
  - name: mission
    purpose: Create a bounded mission and thread.
  - name: status
    purpose: Show current mission state, blockers and evidence.
  - name: plan
    purpose: Show or regenerate the mission plan/graph.
  - name: approve
    purpose: Record an owner approval gate.
  - name: review
    purpose: Dispatch independent review.
  - name: doctor
    purpose: Run OS health checks.
  - name: recover
    purpose: Start governed recovery.
  - name: help
    purpose: Explain this OS and its commands.
